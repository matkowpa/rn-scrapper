name: Scrape – Rada Nadzorcza

on:
  schedule:
    # Cron godzinowy (UTC) – właściwa akcja (zbiórka 8/11/14/17/20 PL,
    # publikacja 6:00 PL) wybierana jest w kroku "Decide mode" wg
    # aktualnego czasu Europe/Warsaw, więc godziny są poprawne cały rok
    # niezależnie od zmiany czasu letniego/zimowego.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      regenerate_registry:
        description: "Odśwież rejestr BIP samorządów (data/bip_jst.json) przed skanem"
        type: boolean
        default: false
        required: false
      resolve_urls:
        description: "Znajdź realne adresy BIP dla podmiotów (wolne: ~30 min)"
        type: boolean
        default: false
        required: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate JST registry (optional)
        if: inputs.regenerate_registry == true
        run: |
          python tools/fetch_bip_registry.py
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bip_jst.json
          git diff --staged --exit-code --quiet || { git commit -m "Rejestr BIP samorzadow — odswiezenie $(date +'%Y-%m-%d')"; git push; }

      - name: Resolve real BIP URLs (optional)
        if: inputs.resolve_urls == true
        run: |
          python tools/resolve_bip_urls.py
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bip_jst_urls.json
          git diff --staged --exit-code --quiet || { git commit -m "Mapowanie slug->realny BIP: $(python -c "import json;d=json.load(open('data/bip_jst_urls.json'));print(sum(1 for v in d.values() if v))") adresow"; git push; }

      - name: Decide mode (DST-safe, czas PL)
        id: mode
        run: |
          HOUR=$(TZ='Europe/Warsaw' date +'%H')
          echo "Godzina PL: $HOUR"
          case "$HOUR" in
            06) MODE=publish ;;
            08|11|14|17|20) MODE=collect ;;
            *) MODE=skip ;;
          esac
          # Ręczne uruchomienie zawsze publikuje od razu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE=publish; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Skip (poza harmonogramem PL)
        if: steps.mode.outputs.mode == 'skip'
        run: echo "Poza zaplanowanymi godzinami PL — nic do zrobienia."

      - name: Run scraper (collect)
        if: steps.mode.outputs.mode == 'collect'
        run: python main.py --months 1 --store --jst-window 100

      - name: Run scraper (publish daily report)
        if: steps.mode.outputs.mode == 'publish'
        run: python main.py --months 1 --jst-window 100

      - name: Save report to docs/reports/
        if: steps.mode.outputs.mode == 'publish'
        run: |
          mkdir -p docs/reports
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          LATEST=$(ls -t raport_rada_nadzorcza_*.html | head -1)
          cp "$LATEST" "docs/reports/${TIMESTAMP}.html"
          echo "Zapisano: $LATEST -> docs/reports/${TIMESTAMP}.html"
          python generate_index.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if [ -n "$(git diff --staged --quiet; echo $?)" ] && [ "$(git diff --staged --quiet; echo $?)" != "0" ]; then :; fi
          git diff --staged --exit-code --quiet && echo "nothing to commit" || \
            { if [ "${{ steps.mode.outputs.mode }}" = "publish" ]; then MSG="Raport dzienny $(date +'%Y-%m-%d %H:%M') UTC"; else MSG="Zbiorka danych $(date +'%Y-%m-%d %H:%M') UTC"; fi; git commit -m "$MSG"; }
          git push
